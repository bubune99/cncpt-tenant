<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CMS · Re-envisioning Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: #e9e5dc; font-family: 'Geist', system-ui, sans-serif; }
  body { overflow: hidden; }

  /* shared utilities */
  .frame { box-sizing: border-box; overflow: hidden; position: relative; }
  .frame * { box-sizing: border-box; }

  /* === DIRECTION A · ATLAS (Editorial Map) === */
  .atlas { background: #efe7d8; color: #1a1410; font-family: 'Geist', sans-serif; }
  .atlas .display { font-family: 'Spectral', serif; font-weight: 500; letter-spacing: -0.02em; }
  .atlas .display-i { font-family: 'Spectral', serif; font-style: italic; font-weight: 400; }
  .atlas .mono { font-family: 'Geist Mono', monospace; }
  .atlas-accent { color: #8b2c1f; }
  .atlas-rule { border-bottom: 1px solid #1a1410; }
  .atlas-rule-thin { border-bottom: 1px solid rgba(26,20,16,.25); }
  .atlas-eyebrow { font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: #8b2c1f; }
  .atlas-fig { font-family: 'Spectral', serif; font-style: italic; font-weight: 400; color: rgba(26,20,16,.6); }
  .atlas-paper { background: #f5efe2; }

  /* === DIRECTION B · STAGE (Spatial Canvas) === */
  .stage { background: #0d1622; color: #e8e2d2;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(232,226,210,.08) 1px, transparent 0);
    background-size: 24px 24px;
    font-family: 'Space Grotesk', sans-serif;
  }
  .stage .mono { font-family: 'Geist Mono', monospace; }
  .stage-card { background: rgba(20,32,50,.85); border: 1px solid rgba(232,226,210,.12); border-radius: 12px; backdrop-filter: blur(6px); }
  .stage-card-warm { background: rgba(255,197,74,.07); border: 1px solid rgba(255,197,74,.3); border-radius: 12px; }
  .stage-card-cyan { background: rgba(77,216,255,.06); border: 1px solid rgba(77,216,255,.3); border-radius: 12px; }
  .stage-pill { background: rgba(77,216,255,.12); color: #4dd8ff; border: 1px solid rgba(77,216,255,.3); border-radius: 999px; padding: 2px 9px; font-size: 11px; font-family: 'Geist Mono', monospace; letter-spacing: .05em; text-transform: uppercase; }
  .stage-pill-amber { background: rgba(255,197,74,.12); color: #ffc54a; border: 1px solid rgba(255,197,74,.3); border-radius: 999px; padding: 2px 9px; font-size: 11px; font-family: 'Geist Mono', monospace; letter-spacing: .05em; text-transform: uppercase; }
  .stage-cyan { color: #4dd8ff; }
  .stage-amber { color: #ffc54a; }
  .stage-dim { color: rgba(232,226,210,.55); }

  /* === DIRECTION C · CONSOLE (Brutalist Operator) === */
  .console { background: #fafaf7; color: #0a0a0a; font-family: 'JetBrains Mono', monospace; }
  .console .display { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.04em; }
  .console-stripe { background: #f4ed37; }
  .console-stripe-hot { background: #ff5b22; color: #fafaf7; }
  .console-rule { border: 1px solid #0a0a0a; }
  .console-rule-2 { border: 2px solid #0a0a0a; }
  .console-cell { border: 1px solid #0a0a0a; padding: 8px 10px; }
  .console-tag { display: inline-block; background: #0a0a0a; color: #fafaf7; padding: 2px 7px; font-size: 10px; letter-spacing: .08em; }
  .console-tag-hot { display: inline-block; background: #ff5b22; color: #fafaf7; padding: 2px 7px; font-size: 10px; letter-spacing: .08em; }
  .console-tag-yel { display: inline-block; background: #f4ed37; color: #0a0a0a; padding: 2px 7px; font-size: 10px; letter-spacing: .08em; }
  .console-dim { color: rgba(10,10,10,.55); }

  /* skinny scrollbars off */
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="direction-atlas.jsx"></script>
  <script type="text/babel" src="direction-stage.jsx"></script>
  <script type="text/babel" src="direction-console.jsx"></script>
  <script type="text/babel" src="wireframes.jsx"></script>
</body>
</html>
